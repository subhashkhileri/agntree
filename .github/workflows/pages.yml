name: Website

# Builds the website from docs/, site/, and CHANGELOG.md and deploys it to
# GitHub Pages. Pull requests build without deploying, so a broken link or an
# unlisted docs page fails the check before it reaches main.
#
# Requires Settings → Pages → Source to be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'media/**'
      - 'resources/icons/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'media/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: each page's "updated" date and sitemap lastmod come from git.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:site

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
