name: Website

# Builds the website from docs/, site/, and CHANGELOG.md and deploys it to
# GitHub Pages. Pull requests build without deploying, so a broken link or an
# unlisted docs page fails the check before it reaches main.
#
# Requires Settings → Pages → Source to be "GitHub Actions".
#
# After a deploy, the pages it changed are sent to IndexNow, so Bing and the
# other engines that take it fetch them within minutes. site/indexnow.mjs says
# how "changed" is decided. Run the workflow by hand with "resubmit_all" to send
# every page, as after moving the site to a new address.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'media/**'
      - 'resources/icons/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'media/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      resubmit_all:
        description: 'IndexNow: send every page, not only the ones this deploy changes'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.request }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: each page's "updated" date and sitemap lastmod come from git.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:site

      # Compared here, while the live site is still the previous deploy. A failure
      # leaves the request empty, so the deploy goes ahead and nothing is sent.
      - name: List the pages this deploy changes
        id: indexnow
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          RESUBMIT_ALL: ${{ inputs.resubmit_all }}
        run: |
          if [ "$RESUBMIT_ALL" = "true" ]; then
            request=$(node site/indexnow.mjs _site/sitemap.xml)
          else
            curl -fsS --retry 2 "$(sed -n 's/^Sitemap: //p' _site/robots.txt)" -o "$RUNNER_TEMP/live-sitemap.xml"
            request=$(node site/indexnow.mjs _site/sitemap.xml "$RUNNER_TEMP/live-sitemap.xml")
          fi
          echo "request=$request" >> "$GITHUB_OUTPUT"

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 200 and 202 both mean the notice was taken; 202 says the key file is still
      # being checked. A refusal fails this step only, never the deploy.
      - name: Send the changed pages to IndexNow
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          REQUEST: ${{ needs.build.outputs.indexnow }}
        run: |
          curl -sS --fail-with-body --retry 2 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$REQUEST" \
            -w 'IndexNow answered HTTP %{http_code}\n'
