name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # The release body is the CHANGELOG section for this version, so notes are
      # written once and only ever need editing there. A missing section fails
      # the release instead of publishing an empty page.
      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > changes.md

          if [ ! -s changes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

          PREVIOUS=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null || true)

          {
            echo "## Agntree v${VERSION}"
            echo
            cat changes.md
            echo
            echo "### Install"
            echo
            echo "- [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=subhashkhileri.agntree)"
            echo "- **Manual:** download the \`.vsix\` below, then run **Extensions: Install from VSIX...**"
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS}...v${VERSION}"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          body_path: release-notes.md
